[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-system"
version = "0.1.0"
description = "FastAPI medicine inventory locator with Supabase backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]==0.34.0",
  "supabase==2.32.0",
  "python-dotenv==1.0.1",
  "pydantic-settings==2.7.1",
]
